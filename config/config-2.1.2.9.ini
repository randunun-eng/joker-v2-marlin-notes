#JOKER-SLB120自动调平
# Marlin Firmware
# config.ini - Options to apply before the build
#
[config:base]
#
# ini_use_config - A comma-separated list of actions to apply to the Configuration files.
#                  The actions will be applied in the listed order.
#  - none
#    Ignore this file and don't apply any configuration options
#
#  - base
#    Just apply the options in config:base to the configuration
#
#  - minimal
#    Just apply the options in config:minimal to the configuration
#
#  - all
#    Apply all 'config:*' sections in this file to the configuration
#
#  - another.ini
#    Load another INI file with a path relative to this config.ini file (i.e., within Marlin/)
#
#  - https://me.myserver.com/path/to/configs
#    Fetch configurations from any URL.
#
#  - example/Creality/Ender-5 Plus @ bugfix-2.1.x
#    Fetch example configuration files from the MarlinFirmware/Configurations repository
#    https://raw.githubusercontent.com/MarlinFirmware/Configurations/bugfix-2.1.x/config/examples/Creality/Ender-5%20Plus/
#
#  - example/default @ release-2.0.9.7
#    Fetch default configuration files from the MarlinFirmware/Configurations repository
#    https://raw.githubusercontent.com/MarlinFirmware/Configurations/release-2.0.9.7/config/default/
#
#  - [disable]
#    Comment out all #defines in both Configuration.h and Configuration_adv.h. This is useful
#    to start with a clean slate before applying any config: options, so only the options explicitly
#    set in config.ini will be enabled in the configuration.
#
#  - [flatten] (Not yet implemented)
#    Produce a flattened set of Configuration.h and Configuration_adv.h files with only the enabled
#    #defines and no comments. A clean look, but context-free.
#
; ini_use_config                           = none

# Load all config: sections in this file
ini_use_config                          = all
# Disable everything and apply subsequent config:base options
;ini_use_config                          = [disable], base
# Load config file relative to Marlin/
;ini_use_config                          = another.ini
# Download configurations from GitHub
;ini_use_config                          = example/Creality/Ender-5 Plus @ bugfix-2.1.x
# Download configurations from your server
;ini_use_config                          = https://me.myserver.com/path/to/configs
# Evaluate config:base and do a config dump
;ini_use_config                          = base
config_export                           = 2

[config:minimal]  ;关键配置
motherboard                              = BOARD_MM_JOKER   ;主板型号 default_envs = esp32
serial_port                              = 0   ;串口号
serial_port_2                            = -1   ;串口号2
baudrate                                 = 250000   ;波特率

oled_panel_tinyboy2                      = on   ;屏幕类型，4线OLED开启这个
; u8glib_ssd1306                           = on   ;OLED屏幕驱动
display_sleep_minutes                    = 3   ;息屏时间
editable_display_timeout                 = on   ;息屏超时菜单
lcd_language                             = en   ;UI语言 'en':'English', 'an':'Aragonese', 'bg':'Bulgarian', 'ca':'Catalan', 'cz':'Czech', 'da':'Danish', 
;'de':'German', 'el':'Greek (Greece)', 'el_CY':'Greek (Cyprus)', 'es':'Spanish', 'eu':'Basque-Euskera', 'fi':'Finnish', 'fr':'French', 'gl':'Galician',
; 'hr':'Croatian', 'hu':'Hungarian', 'it':'Italian', 'jp_kana':'Japanese', 'ko_KR':'Korean (South Korea)', 'nl':'Dutch', 'pl':'Polish', 'pt':'Portuguese', 
; 'pt_br':'Portuguese (Brazilian)', 'ro':'Romanian', 'ru':'Russian', 'sk':'Slovak', 'sv':'Swedish', 'tr':'Turkish',
;  'uk':'Ukrainian', 'vi':'Vietnamese', 'zh_CN':'Chinese (Simplified)', 'zh_TW':'Chinese (Traditional)'
encoder_rate_multiplier                  = on   ;当编码器旋转速度加快时，更快地更改值
encoder_10x_steps_per_sec                = 30   ;(步/秒) 10倍速时的编码器速率---（按键3，编码器30）---
encoder_100x_steps_per_sec               = 80   ; (步/秒) 100倍速时的编码器速率---（按键5，编码器80）---
sdsupport                                = on   ;内存卡支持
sd_check_and_retry                       = on   ;内存卡启用CRC校验

esp3d_wifisupport                        = on   ;启动ESP32 WIFI
websupport                               = on   ;启动一个网络服务器
otasupport                               = on   ;支持无线固件更新
wifi_custom_command                      = on   ;接受来自主机的功能配置命令

[config:basic]  ;参数配置，非主要参数都可以默认
corexy                                   = off   ;机型设置，XYZ结构-off/corexy结构-on

extruders                                = 1   ;挤出机数量
default_nominal_filament_dia             = 1.75   ;耗材直径

temp_sensor_0                            = 1   ;喷头 温度传感器类型1=100K
temp_sensor_bed                          = 1   ;热床 温度传感器类型

heater_0_mintemp                         = -10   ;喷头 最低温度
heater_0_maxtemp                         = 255   ;喷头 最高温度------（喉管内置有特氟龙管的喷头设置265,铁氟龙耐温250）------
bed_mintemp                              = -10   ;热床 最低温度
bed_maxtemp                              = 120   ;热床 最高温度

x_driver_type                            = A4988   ;驱动类型'A4988', 'A5984', 'DRV8825', 'LV8729', 'TB6560', 'TB6600',   ------（主要参数）------
y_driver_type                            = A4988   ; 'TMC2100', 'TMC2130', 'TMC2130_STANDALONE', 'TMC2160', 'TMC2160_STANDALONE',
z_driver_type                            = A4988   ;'TMC2208', 'TMC2208_STANDALONE', 'TMC2209', 'TMC2209_STANDALONE', 'TMC2240', 'TMC2660', 'TMC2660_STANDALONE',
e0_driver_type                           = A4988   ;'TMC5130', 'TMC5130_STANDALONE', 'TMC5160', 'TMC5160_STANDALONE'  ------（无UART模式的2208等其他驱动都设置A4988即可）------

x_bed_size                               = 125   ;平台尺寸X  ------（主要参数）------
y_bed_size                               = 125   ;平台尺寸Y  ------（主要参数）------
x_min_pos                                = 0   ;X最小位置
x_max_pos                                = X_BED_SIZE   ;X最大位置
y_min_pos                                = 0   ;Y最小位置
y_max_pos                                = 145   ;Y最大位 Y_BED_SIZE
z_min_pos                                = 0   ;Z最小位置
z_max_pos                                = 145   ;Z最大位置  ------（主要参数）------

default_axis_steps_per_unit              = { 100, 100, 1600, 87 }    ;脉冲- { 80, 80, 400, 87 }   ------（主要参数）------
; axis_relative_modes                      = { false, false, false, false }   ;运动模式 false绝对模式 (G90)
default_max_feedrate                     = { 200, 200, 5, 60 }   ;最大速度
default_max_acceleration                 = { 2000, 2000, 100, 4000 }   ;加速度
default_acceleration                     = 1200   ;打印加速度
default_travel_acceleration              = 1200   ;空驶加速度
default_retract_acceleration             = 2000   ;回抽加速度

use_xmin_plug                            = off   ;X无最小端限位（X归位到最大端）
use_xmax_plug                            = on    ;X最大端限位
use_ymin_plug                            = on    ;Y最小端限位
use_zmin_plug                            = on    ;Z最小端限位
x_home_dir                               = 1   ;归位方向-1最小方向，1最大方向
y_home_dir                               = -1   ;
z_home_dir                               = -1   ;
x_min_endstop_inverting                  = true   ;限位触发电平 光电限位-常闭HIGH，机械限位-常开LOW
x_max_endstop_inverting                  = true   ;
y_min_endstop_inverting                  = true   ;
y_max_endstop_inverting                  = true   ;
z_min_endstop_inverting                  = true   ;
z_max_endstop_inverting                  = true   ;
z_min_probe_endstop_inverting            = true   ;Z探针

invert_x_dir                             = true   ;电机方向false/true
invert_y_dir                             = false    ;
invert_z_dir                             = true   ;
invert_e0_dir                            = false   ;

thermal_protection_bed                   = on   ;热保护 热床    ---小鲁班12V不开off，24V开on---
pidtempbed                               = on   ;启用热床 PID控制   ---小鲁班12V不开off，24V开on---
[config:advanced]  ;高级配置，按需配置
lcd_bed_tramming                         = on   ;手动调平菜单
bed_tramming_inset_lfrb                  = { 20, 20, 20, 20 }   ;离边缘距离
bed_tramming_height                      = 0.0   ;探点Z轴高度
bed_tramming_z_hop                       = 4.0   ;走线点之间的Z轴提升量
bed_tramming_leveling_order              = { LB,LF }   ;常规4点{ LF, RF, RB, LB } 小鲁班3点{ LB,LF }   ------（按需配置）------
;------------自动调平------------
lcd_bed_leveling                         = on   ;增加调平菜单   ------（按需配置）------
probe_offset_wizard                      = on   ;Z偏移校准菜单   ------（按需配置）------
Z_AFTER_HOMING                           = 3    ;归位（G28）后Z停留位置，开自动调平设置3，不开设置0。   ------（按需配置）------
min_software_endstop_z                   = off   ;Z轴软限位min,无自动调平on开启，有则off关闭，允许喷头下降到0点以下   ------（按需配置）------
Z_SAFE_HOMING                            =off   ;Z归零前 XY移动到平台中间，       1：探针和Z限位同一个=on，  2：探针和Z限位各自有=off，    3：无自动调平=off   ------（按需配置）------
Z_MIN_PROBE_USES_Z_MIN_ENDSTOP_PIN       =off   ;用调平探针做Z限位，              1：探针和Z限位同一个=on，  2：探针和Z限位各自有=off，   3：无自动调平=off   ------（按需配置）------
Z_MIN_PROBE_PIN                          =14   ;单独的调平探针需要设置探针的PIN，1：探针和Z限位同一个就off，2：探针和Z限位各自有=对应PIN，3：无自动调平=off   ------（按需配置）------
;探头类型只选其中一种
FIX_MOUNTED_PROBE                        =on   ;固定安装探头（接近开关   ------（按需配置）------
NOZZLE_AS_PROBE                          =off   ;喷嘴作为探头
BLTOUCH                                  =off   ; Touch探头，需要设置舵机引脚SERVO0_PIN=

auto_bed_leveling_bilinear               = on   ;调平类型-双线性校平，无则off   ------（按需配置）------
grid_max_points_x                        = 3   ;X调平的点数   ------（按需配置）------
grid_max_points_y                        = GRID_MAX_POINTS_X   ;Y调平的点数

restore_leveling_after_g28               = on   ;禁止G28指令清除调平信息
nozzle_to_probe_offset                   = { 12, -30, 0 }   ;探头偏移量：喷嘴移动到探头的指令值
probing_margin                           = 15   ;探测边界，探测最边缘的点离平台的距离 mm
xy_probe_feedrate                        = (150*60)   ;探测时XY的移动速度 
z_probe_feedrate_fast                    = (5*60)   ;探测时Z的速度
z_probe_feedrate_slow                    = (Z_PROBE_FEEDRATE_FAST / 2)   ;二次精确探测的进给速度
multiple_probing                         = 2   ;探测次数
; z_clearance_deploy_probe                 = 5   ;收起时的Z轴间隙
; z_clearance_between_probes               = 5   ;探针点之间的Z向间隙
; z_clearance_multi_probe                  = 5   ;多个探针之间的Z向间隙
z_after_probing                          = 5   ;探测完成后的Z位置
z_probe_low_point                        = -2   ;触发点以下停止前可达到的最远距离
default_leveling_fade_height             = 10.0   ;淡出Z高度mm

;------------断电续打------------若用了探针和Z限位同一个的自动调平，则不要开启断电续打
power_loss_recovery                      = on   ;断电续打   ------（按需配置）------
plr_enabled_default                      = true   ;默认是否开启，ESP32只能默认true，否则会无限重启
power_loss_min_z_change                  = 0.05   ; 保存断电数据前的最小Z轴变化量

;------------断丝检测------------
filament_runout_sensor                   = on   ;启动断丝检测   ------（按需配置）------
fil_runout_enabled_default               = true   ;启动时启用传感器
num_runout_sensors                       = 1   ;传感器数量
fil_runout_state                         = LOW   ;未检测到丝材的引脚状态
fil_runout_pullup                        = on   ;对传感器引脚使用内部上拉电阻

nozzle_park_feature                      = on   ;断丝检测或暂停时，将喷嘴停放在指定的XYZ位置。
nozzle_park_move                         = 0   ;停放动作：0 = XY移动，1 = 仅X移动，2 = 仅Y移动，3 = 先X后Y，4 = 先Y后X
nozzle_park_point                        = { (X_MIN_POS + 2), (Y_MIN_POS + 2), 0 }   ;暂停停留位置
nozzle_park_z_raise_min                  = 1   ;始终至少将Z轴提升此距离 mm
nozzle_park_xy_feedrate                  = 100   ;X轴和Y轴的速度 mm/s
nozzle_park_z_feedrate                   = 5   ;Z轴速度 mm/s

advanced_pause_feature                   = on   ;高级暂停功能，用于更换丝材
pause_park_retract_feedrate              = 20   ;初始回抽进给速度 mm/s
pause_park_retract_length                = 0   ;初始回抽长度 mm
filament_change_unload_feedrate          = 20   ;卸载丝材的速度 mm/s
filament_change_unload_accel             = 25   ;加速度 mm/s^2
filament_change_unload_length            = 100   ;完全卸载所需的丝材长度 mm
filament_change_slow_load_feedrate       = 20   ;开始加载时缓慢移动 mm/s
filament_change_slow_load_length         = 0   ;慢速长度 mm 0 表示禁用开始加载，直接跳到仅快速加载
filament_change_fast_load_feedrate       = 20   ;加载丝材的速度 mm/s
filament_change_fast_load_accel          = 25   ;加速度 mm/s^2
filament_change_fast_load_length         = 0   ;从挤出机齿轮到喷嘴的丝材加载长度 mm
advanced_pause_purge_feedrate            = 6   ; 加载速度 mm/s
advanced_pause_purge_length              = 60   ;加载长度 mm
advanced_pause_resume_prime              = 0   ;从停放位置返回后，喷嘴预置的额外距离 mm
filament_unload_purge_retract            = 0   ; 卸载初始回抽长度mm
filament_unload_purge_delay              = 600   ;回抽后丝材冷却的延迟时间 ms
filament_unload_purge_length             = 10   ;退料前，清空材料长度 mm
filament_unload_purge_feedrate           = 3   ;退料前清空的进给速度 mm/s
pause_park_nozzle_timeout                = 45   ;为安全起见，喷嘴加热关闭时限 S
filament_change_alert_beeps              = 10   ;需要响应时发出的提示蜂鸣声次数
pause_park_no_stepper_timeout            = on   ;使XYZ步进器在更换丝材时保持通电状态
park_head_on_pause                       = on   ;在暂停和更换丝材时停放喷嘴
filament_load_unload_gcodes              = on   ;添加M701/M702加载/卸载G代码，并在LCD准备菜单中添加加载/卸载选项
configure_filament_change                = on   ;添加M603 G代码和菜单项

;------------激光/主轴------------
SPINDLE_FEATURE                          = on   ;主轴，二选一,SPARROW激光也选这个   ------（按需配置）------
laser_feature                            = off   ;激光，二选一
spindle_laser_active_state               = HIGH   ;处于高电平，则设置为 "HIGH"
spindle_laser_use_pwm                    = on   ;支持设置速度/功率
spindle_laser_pwm_invert                 = false   ;主轴/激光频率
SPINDLE_LASER_FREQUENCY                  = off   ;主轴/激光频率
SPINDLE_SERVO                            = off   ;控制激光的舵机

;------------高级功能------------
babystepping                             = off   ;微步调整开启
babystep_multiplicator_xy                = 1   ;每个XY微步的步数或毫米距离
babystep_invert_z                        = on   ;on/off改调整方向
babystep_multiplicator_z                 = 1   ;每个Z轴微步的步数或毫米距离

s_curve_acceleration                     = on   ;S曲线加速

lin_advance                              = off   ;线性挤出
advance_k                                = 0.22   ;每1mm/s挤出速度下的压缩长度
advance_k_extra                          = on   ; 添加第二个线性推进常数，可通过M900 L配置
experimental_i2s_la                      = on   ;允许I2S_STEPPER_STREAM与LA一起使用

shaping_menu                             = off   ;添加输入整形设置菜单
input_shaping_x                          = off   ;输入整形开X
shaping_freq_x                           = 40.0
shaping_zeta_x                           = 0.4
input_shaping_y                          = off   ;输入整形开Y
shaping_freq_y                           = 40.0
shaping_zeta_y                           = 0.4

;------------后面的一般不改动------------
use_watchdog                             = on   ;启用看门狗（防止程序死机导致持续加热）
thermal_protection_hotends               = on   ;热保护 喷头
thermal_protection_hysteresis            = 10   ;波动范围℃
thermal_protection_period                = 120   ;检查周期S
; thermal_protection_bed                   = on   ;热保护 热床
thermal_protection_bed_hysteresis        = 2   ;波动范围℃
thermal_protection_bed_period            = 120   ;检查周期S

pid_edit_menu                            = on   ;菜单中添加PID编辑功能
pid_autotune_menu                        = on   ;菜单中添加PID自动调谐功能
pidtemp                                  = on   ;启用喷头PID控制
; pid_k1                                   = 0.95   ;PID 低通滤波系数（用于温度检测信号）
; pid_max                                  = 255   ;PID 输出的最大 PWM 值（通常 255 = 全功率）
; pid_functional_range                     = 10   ;当温度与目标温度差值 ≥此℃ 时，PID 输出固定为 pid_max，加快升温。
default_kp                               = 18.00   ;喷头PID值
default_ki                               = 1.47   ;
default_kd                               = 55.30   ;
; pidtempbed                               = on   ;启用热床 PID控制
default_bed_kp                           = 74.10   ;热床PID值
default_bed_ki                           = 14.22   ;
default_bed_kd                           = 257.80   ;

temp_residency_time                      = 5   ;喷头 等待温度“稳定”的时间
temp_window                              = 3   ;喷头 达到温度”计时器的温度接近值
temp_hysteresis                          = 6   ;喷头 温度接近度被认为“足够接近”目标值
temp_bed_residency_time                  = 5   ;热床 等待温度“稳定”的时间
temp_bed_window                          = 2   ;热床 达到温度”计时器的温度接近值
temp_bed_hysteresis                      = 3   ;热床 温度接近度被认为“足够接近”目标值

bed_overshoot                            = 10   ;热床 加热时的允许过冲温度
hotend_overshoot                         = 15   ;喷头 加热时的允许过冲温度
watch_temp_period                        = 120   ;喷头 必须在   S内
watch_temp_increase                      = 2   ;喷头 升温至少  ℃，否则报错
watch_bed_temp_period                    = 1800000   ;热床 必须在   S内
watch_bed_temp_increase                  = 1   ;热床 升温至少  ℃，否则报错
bed_check_interval                       = 5000   ;热床 bang-bang控制中检查的间隔时间
; max_bed_power                            = 255   ;热床 电流限制，满电流255

homing_feedrate_mm_m                     = { (50*60), (50*60), (4*60) }    ;归零时的移动速度
homing_bump_mm                           = { 5, 5, 2 }   ;归零首次碰触后后退的距离
homing_bump_divisor                      = { 2, 2, 4 }   ;撞停后第二次归零的速度除数
homing_backoff_post_mm                   = { 0, 0, 0 }   ;归位后回退位置 停留，sparrow的xy至少设置2
z_homing_height                          = 5   ;归位（G28）前的最小Z高度

prevent_lengthy_extrude                  = on   ;挤出长度限制
extrude_maxlength                        = 200   ;最长单次挤出长度
prevent_cold_extrusion                   = on   ;启动挤出保护
extrude_mintemp                          = 170   ;挤出机启动最低温度

eeprom_settings                          = on   ;M500保存设置开启
eeprom_boot_silent                       = on   ;保持M503静默，仅在首次加载时给出错误提示
eeprom_chitchat                          = on   ;对EEPROM命令给出反馈
eeprom_auto_init                         = on   ;出现任何错误时自动初始化EEPROM
eeprom_init_now                          = on   ;每次新构建后首次启动时初始化EEPROM。

preheat_1_label                          = "PLA"   ;预热设置PLA
preheat_1_temp_hotend                    = 210   ;喷头温度
preheat_1_temp_bed                       = 60   ;热床温度
preheat_1_fan_speed                      = 0   ;风扇功率
preheat_2_label                          = "ABS"   ;预热设置ABS
preheat_2_temp_hotend                    = 240   ;喷头温度
preheat_2_temp_bed                       = 100   ;床温度
preheat_2_fan_speed                      = 0   ;风扇功率

e0_auto_fan_pin                          = 142   ;挤出机喉管风扇引脚

;------------后面的不建议动------------
num_servos                               = 0   ;舵机数量

arc_support                              = on   ;支持 G2/G3 圆弧命令
auto_report_temperatures                 = on   ;周期性自动报告温度（用于 OctoPrint 等上位机）
; n_arc_correction                         = 25   ;校正点之间的插值段数
